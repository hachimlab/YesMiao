<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="编程猫社区第三方前端：论坛、作品和个人中心" />
    <!-- 状态栏/标题栏颜色，跟顶栏一致；下面的脚本按深浅色改写 -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS 16.4 以前不读 manifest，添加到主屏幕后靠这几个以独立窗口打开 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YesMiao" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>YesMiao</title>
    <script>
      // 首屏前就应用外观设置（深浅色、主题色、字号、背景图、自定义 CSS 等），避免刷新时闪一下默认样式。
      // 设置的读写和设置页在 src/lib/appearance.ts，它也调用这里的 apply，两边共用一份逻辑
      (function () {
        var KEY = 'yesmiao-appearance';
        var BG_KEY = 'yesmiao-appearance-bg';
        var root = document.documentElement;
        var systemDark = matchMedia('(prefers-color-scheme: dark)');
        // 网址带 ?nostyle 时跳过自定义 CSS 和背景图，样式写坏了也能打开设置页改回来
        var safe = /[?&]nostyle(=|&|$)/.test(location.search);

        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function load() {
          var s;
          try {
            s = JSON.parse(read(KEY));
          } catch (e) {}
          if (!s || typeof s !== 'object') {
            // 旧版本只存了 theme
            var t = read('theme');
            s = t === 'light' || t === 'dark' ? { theme: t } : {};
          }
          return s;
        }
        function attr(name, value) {
          if (value) root.setAttribute('data-' + name, value === true ? '' : value);
          else root.removeAttribute('data-' + name);
        }
        function prop(name, value) {
          if (value === null || value === undefined || value === '') root.style.removeProperty(name);
          else root.style.setProperty(name, String(value));
        }
        /** 主题色太亮（黄、浅绿这类）时按钮上的字改用深色；阈值取得偏高，中等亮度的颜色仍用白字 */
        function textOn(hex) {
          var c = [1, 3, 5].map(function (i) {
            var v = parseInt(hex.substr(i, 2), 16) / 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.3 ? '#111' : '#fff';
        }
        function backgroundUrl(bg) {
          if (!bg || safe) return null;
          var src = bg.kind === 'upload' ? read(BG_KEY) : bg.kind === 'url' ? bg.url : null;
          if (!src || !/^(https?:\/\/|data:image\/)/i.test(src)) return null;
          return 'url("' + src.replace(/["\\\n\r]/g, '') + '")';
        }
        function customCss(css) {
          var el = document.getElementById('yesmiao-custom-css');
          if (!css || safe) {
            if (el) el.remove();
            return;
          }
          if (!el) {
            el = document.createElement('style');
            el.id = 'yesmiao-custom-css';
          }
          el.textContent = css;
          // 放在 body 末尾，排在站点样式表之后，同样的选择器才能覆盖站点样式
          if (document.body) document.body.appendChild(el);
          else {
            document.head.appendChild(el);
            document.addEventListener('DOMContentLoaded', function () {
              document.body.appendChild(el);
            });
          }
        }

        function apply(s) {
          var theme = s.theme === 'light' || s.theme === 'dark' ? s.theme : systemDark.matches ? 'dark' : 'light';
          root.dataset.theme = theme;
          // 与 styles.css 里两套主题的 --body-bg 一致
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#16181b' : '#ffffff';
          // 没选过主题色时用默认的黄色（与 src/lib/appearance.ts 的 DEFAULT_ACCENT 一致），同样从 --accent 混出其余颜色
          var accent = typeof s.accent === 'string' && /^#[0-9a-f]{6}$/i.test(s.accent) ? s.accent : '#fec433';
          attr('accent', true);
          prop('--accent', accent);
          prop('--on-accent', textOn(accent));
          attr('accent-bright', textOn(accent) === '#111');
          attr('font-size', s.fontSize !== 'md' && s.fontSize);
          prop('--post-line-height', s.lineHeight);
          attr('serif', !!s.serif);
          attr('density', s.density !== 'normal' && s.density);
          attr('radius', s.radius !== 'normal' && s.radius);
          attr('work-view', s.workView !== 'grid' && s.workView);
          var bg = backgroundUrl(s.background);
          attr('bg', !!bg);
          prop('--bg-image', bg);
          prop('--bg-blur', bg && (s.background.blur || 0) + 'px');
          prop('--bg-dim', bg && Math.round((s.background.dim === undefined ? 0.8 : s.background.dim) * 100) + '%');
          attr('glass', !!s.glass);
          attr('motion', s.motion !== 'auto' && s.motion);
          attr('hide-avatars', !!s.hideAvatars);
          attr('hide-counts', !!s.hideCounts);
          customCss(s.customCss);
        }

        window.YesMiaoAppearance = { apply: apply, load: load, safe: safe, KEY: KEY, BG_KEY: BG_KEY };
        apply(load());
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
